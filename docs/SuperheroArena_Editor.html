local function normalize(value)
	if type(value) ~= "string" then return "" end
	return value:lower():gsub("&lt;[^&gt;]*&gt;", ""):gsub("[^%w]", "")
end
local HERO_LOOKUP = {}
local DISPLAY_LOOKUP, MENU_ALIASES = {}, {}
for name in pairs(HERO_COLORS) do
	HERO_LOOKUP[normalize(name)] = name; DISPLAY_LOOKUP[normalize(name)] = name
end
for alias, name in pairs({ ["drstrange"] = "Doctor Strange", ["theflash"] = "Flash",
	["spider man"] = "Spiderman", ["ironman"] = "Iron Man", ["captainamerica"] = "Captain America",
	-- Confirmed by the user against the hero selection screen.
	["water"] = "Aquaman", ["earth"] = "Hulk", ["knight"] = "Thor",
	["samurai"] = "Deadpool", ["nature"] = "Groot" }) do
	HERO_LOOKUP[normalize(alias)] = name
end
-- Requested best-effort guesses. These are not verified game mappings.
-- All heroes in the supplied roster also match their actual names directly.
local GUESSED_ALIASES = {
	fire = "Ghost Rider", ice = "Frozone", wind = "Storm", angel = "Superman",
	tech = "Iron Man", technology = "Iron Man", armor = "Iron Man",
	spider = "Spiderman", web = "Spiderman", shield = "Captain America", speed = "Flash",
	metal = "Magneto", magnetism = "Magneto", lightning = "Thor", thunder = "Thor",
	magic = "Doctor Strange", sorcery = "Doctor Strange", darkness = "Raven",
	claws = "Wolverine", claw = "Wolverine", redearth = "Red Hulk", lava = "Red Hulk",
	butcher = "Billy Butcher", arsenal = "War Machine", weaponry = "War Machine",
	shadow = "Batman", bat = "Batman", cosmic = "Thanos", titan = "Thanos",
	illusion = "Loki", trickster = "Loki", symbiote = "Venom",
	galactic = "Galactic Thanos", galaxy = "Galactic Thanos",
}
local allowHeroGuesses = true
local PREFIXES = { "currentlyequipped", "equippedcharacter", "equippedhero", "currentcharacter", "currenthero",
	"selectedcharacter", "selectedhero", "playingas", "equipped", "selected", "character", "superhero", "hero", "role" }
local function canonical(value)
	local key = normalize(value)
	local function lookup(id)
		if HERO_LOOKUP[id] then return HERO_LOOKUP[id], "confirmed" end
		if MENU_ALIASES[id] then return MENU_ALIASES[id], "menu" end
	end
	local hero, kind = lookup(key)
	if hero then return hero, kind end
	for _, prefix in ipairs(PREFIXES) do
		if key:sub(1, #prefix) == prefix then
			local match, source = lookup(key:sub(#prefix + 1))
			if match then return match, source end
		end
	end
	return nil
end
local EMPTY_IDENTIFIERS = { none = true, nilvalue = true, ["nil"] = true, null = true, unknown = true,
	loading = true, pending = true, waiting = true, unselected = true, notselected = true,
	nohero = true, default = true, ["true"] = true, ["false"] = true }
local function gameIdentifier(value)
	if type(value) ~= "string" then return nil end
	local clean = value:gsub("&lt;[^&gt;]*&gt;", ""):match("^%s*(.-)%s*$")
	if clean == "" or #clean &gt; 64 or clean:find("%c") or tonumber(clean) or EMPTY_IDENTIFIERS[normalize(clean)] then return nil end
	return clean
end
local KEY_RANK = {
	-- Confirmed in Superhero Arena's replicated character data.
	morphcurrent = 150, power = 140,
	equippedhero = 100, currenthero = 100, equippedcharacter = 100, currentcharacter = 100,
	activehero = 100, activecharacter = 100, heroname = 90, charactername = 90,
	superhero = 90, hero = 90, character = 85, morph = 85, morphname = 85,
	selectedhero = 80, selectedcharacter = 80, chosenhero = 80, chosencharacter = 80,
	selectedclass = 75, classname = 70, class = 70, rolename = 65, role = 65,
	currentmorph = 100, equippedmorph = 100, currentkit = 90, equippedkit = 90,
	heroequipped = 100, characterequipped = 100, superheroname = 90, kit = 60, loadout = 55,
}
local function fieldRank(key)
	local n = normalize(key)
	for _, prefix in ipairs({ "previous", "last", "old", "owned", "unlocked", "available" }) do
		if n:sub(1, #prefix) == prefix then return nil end
	end
	return KEY_RANK[n] or ((n:find("hero", 1, true) or n:find("character", 1, true)) and 45 or nil)
end
local function excluded(node)
	return node.Name == "SHA_Tag" or node.Name == "SHA_Highlight" or node.Name:sub(1, 8) == "RiftSHA_"
end
local function pathOf(node)
	local ok, path = pcall(node.GetFullName, node)
	return ok and path or node.Name
end
local function readValue(node)
	if node:IsA("StringValue") or node:IsA("IntValue") or node:IsA("NumberValue") then return node.Value end
	if node:IsA("ObjectValue") and node.Value then return node.Value.Name end
	return nil
end
local MENU_ID_KEYS = { morphcurrent = true, morphid = true, power = true, powerid = true,
	heroid = true, characterid = true, abilityid = true, internalname = true }
local function scanMenuMappings()
	-- Learn only explicit ID fields beside one unambiguous roster label.
	-- Never infer a mapping from an avatar's appearance or a generic frame name.
	local pg = LocalPlayer:FindFirstChildOfClass("PlayerGui")
	if not pg then table.clear(MENU_ALIASES); return 0 end
	local queue, cursor, scopes, proposed, conflicts = { pg }, 1, {}, {}, {}
	while cursor &lt;= #queue and cursor &lt;= 5000 do
		local node = queue[cursor]; cursor += 1
		if not excluded(node) then
			local hero = (node:IsA("TextLabel") or node:IsA("TextButton")) and DISPLAY_LOOKUP[normalize(node.Text)]
			if hero then
				local scope = node
				for _ = 1, 4 do
					if not scope or scope:IsA("ScreenGui") or scope:IsA("PlayerGui") then break end
					if not scopes[scope] then scopes[scope] = {} end
					scopes[scope][hero] = true; scope = scope.Parent
				end
			end
			for _, child in ipairs(node:GetChildren()) do if #queue &lt; 5000 then table.insert(queue, child) end end
		end
	end
	local function propose(raw, hero)
		local id = gameIdentifier(raw)
		if not id then return end
		local key = normalize(id)
		if HERO_LOOKUP[key] then return end -- Preserve direct names and user-confirmed mappings.
		if proposed[key] and proposed[key] ~= hero then conflicts[key] = true else proposed[key] = hero end
	end
	for scope, heroes in pairs(scopes) do
		local hero, count = nil, 0
		for name in pairs(heroes) do hero = name; count += 1 end
		if count == 1 then
			for key, value in pairs(scope:GetAttributes()) do if MENU_ID_KEYS[normalize(key)] then propose(value, hero) end end
			for _, child in ipairs(scope:GetChildren()) do
				if MENU_ID_KEYS[normalize(child.Name)] then propose(readValue(child), hero) end
			end
		end
	end
	local count = 0
	for key, hero in pairs(proposed) do
		if conflicts[key] then MENU_ALIASES[key] = nil else MENU_ALIASES[key] = hero; count += 1 end
	end
	return count
end
local function resolveHero(plr, diagnostic)
	local best, bestScore, bestPath, bestKind = nil, -math.huge, nil, nil
	local evidence, evidenceByPath, visited = {}, {}, 0
	local function candidate(raw, score, path, allowIdentifier)
		local hero, kind = canonical(raw)
		local unmapped = false
		if not hero and allowIdentifier and allowHeroGuesses then
			hero = GUESSED_ALIASES[normalize(raw)]; if hero then kind = "guess" end
		end
		if not hero and allowIdentifier then hero = gameIdentifier(raw); unmapped = hero ~= nil; kind = "internal" end
		if diagnostic and raw ~= nil then
			local entry = evidenceByPath[path]
			if not entry and #evidence &lt; 50 then
				entry = { score = -math.huge }; evidenceByPath[path] = entry; table.insert(evidence, entry)
			end
			if entry and score &gt; entry.score then
				entry.path = path; entry.raw = tostring(raw):sub(1, 120)
				entry.hero = hero; entry.unmapped = unmapped; entry.kind = kind; entry.score = score
			end
		end
		if hero and score &gt; bestScore then best, bestScore, bestPath, bestKind = hero, score, path, kind end
	end
	local function inspect(node, bonus)
		for key, value in pairs(node:GetAttributes()) do
			local rank = fieldRank(key)
			if rank then candidate(value, rank + bonus, pathOf(node) .. ".@" .. key) end
		end
		local rank = fieldRank(node.Name)
		if not rank and node.Parent and (node.Name == "Value" or node.Name == "Name" or node.Name == "Current") then
			rank = fieldRank(node.Parent.Name)
		end
		if rank then
			local raw = readValue(node)
			if node:IsA("ObjectValue") and node.Value == plr.Character and raw == plr.Name then raw = nil end
			candidate(raw, rank + bonus, pathOf(node) .. ".Value")
			if node:IsA("ObjectValue") and node.Value then
				for key, value in pairs(node.Value:GetAttributes()) do
					if fieldRank(key) then candidate(value, rank + bonus, pathOf(node) .. "-&gt;@" .. key) end
				end
			end
		end
	end
	local function walk(root, bonus, budget)
		if not root then return end
		local queue, cursor = { root }, 1
		while cursor &lt;= #queue and cursor &lt;= budget do
			local node = queue[cursor]; cursor += 1; visited += 1
			if not excluded(node) and not node:IsA("PlayerGui") then
				inspect(node, bonus)
				if root == plr.Character and (node:IsA("TextLabel") or node:IsA("TextButton")) then
					-- Only text in an actual character overhead GUI, not random labels or our ESP.
					if node:FindFirstAncestorWhichIsA("BillboardGui") and (fieldRank(node.Name)
						or normalize(node.Text) ~= normalize(plr.Name) and normalize(node.Text) ~= normalize(plr.DisplayName)) then
						candidate(node.Text, 72, pathOf(node) .. ".Text")
					end
				end
				for _, child in ipairs(node:GetChildren()) do
					if #queue &lt; budget then table.insert(queue, child) end
				end
			end
		end
	end
	-- Current character state outranks equally named lobby/player selections.
	if plr.Character then
		local char = plr.Character
		local path = pathOf(char)
		-- These two root attributes are confirmed by the live detection report.
		-- The active morph takes priority over older selections and HUD text.
		-- An unfamiliar name in these confirmed fields is still a real game ID.
		-- Display it as-is until its corresponding roster hero is confirmed.
		candidate(char:GetAttribute("MorphCurrent"), 200, path .. ".@MorphCurrent", true)
		candidate(char:GetAttribute("power"), 190, path .. ".@power", true)
		if plr.Character.Name ~= plr.Name then candidate(plr.Character.Name, 55, pathOf(plr.Character) .. ".Name") end
		walk(plr.Character, 8, 450)
	end
	walk(plr, 0, 350)
	if plr == LocalPlayer then
		local pg = plr:FindFirstChildOfClass("PlayerGui")
		if pg then
			local queue, cursor = { pg }, 1
			while cursor &lt;= #queue and cursor &lt;= 900 do
				local node = queue[cursor]; cursor += 1
				if not excluded(node) then
					if node:IsA("TextLabel") or node:IsA("TextButton") then
						local key = normalize(node.Text)
						if key:sub(1, 8) == "equipped" or key:sub(1, 9) == "playingas"
							or key:sub(1, 11) == "currenthero" or key:sub(1, 16) == "currentcharacter"
							or key:sub(1, 17) == "currentlyequipped" then
							candidate(node.Text, 115, pathOf(node) .. ".Text")
						end
					end
					for _, child in ipairs(node:GetChildren()) do if #queue &lt; 900 then table.insert(queue, child) end end
				end
			end
		end
	end
	table.sort(evidence, function(a, b) return a.score &gt; b.score end)
	return best, bestPath, evidence, visited, bestKind
end
local heroCache = {}
local function refreshHero(plr)
	local name, source, _, _, kind = resolveHero(plr, false)
	local entry = { name = name, source = source, kind = kind, character = plr.Character }
	heroCache[plr] = entry
	return entry
end

	local color = name and HERO_COLORS[name]
	if color == "RAINBOW" then return Color3.fromHSV((os.clock() * 0.15) % 1, 0.78, 1) end
	return color or C.accent
end
local function roleFor(plr)
	local entry = heroCache[plr]
	if not entry or entry.character ~= plr.Character then return nil end
	return entry.name, entry.kind
end

	if not name then return "Hero not detected" end
	return name .. (kind == "guess" and " (guess)" or "")

local function release(press)
	if not held[press] then return end
	held[press]=nil
	pcall(function()
		if press.Key then vim:SendKeyEvent(false,press.Key,false,game)
		else vim:SendMouseButtonEvent(press.X,press.Y,0,false,game,0) end
	end)
end

local function keyPulse(key)
	if not vim then return false,"Virtual input unavailable" end
	for press in pairs(held) do if press.Key==key then release(press) end end
	local ok=pcall(function() vim:SendKeyEvent(true,key,false,game) end)
	if not ok then return false,"Game key input unavailable" end
	local press={Key=key}; held[press]=true
	task.delay(0.05,function() release(press) end)
	return true
end
local function visible(button)
	if not button.Parent then return false end
	local p=button
	while p do
		if p:IsA("GuiObject") and not p.Visible then return false end
		if p:IsA("ScreenGui") and not p.Enabled then return false end
		p=p.Parent
	end
	return true
end

	Controls.List={}; Controls.Age=0
	local pg=LocalPlayer:FindFirstChild("PlayerGui")
	if not pg then return end
	for i,button in ipairs(pg:GetDescendants()) do
		if i&gt;3000 then break end
		if button:IsA("GuiButton") and not button:IsDescendantOf(gui) and visible(button) then
			local item={Button=button,Words={}}
			item.Words[normalize(button.Name)]=true
			if button:IsA("TextButton") then item.Words[normalize(button.Text)]=true end
			item.Name=button:GetAttribute("SkillName") or button:GetAttribute("AbilityName")
			local key=button:GetAttribute("KeyCode") or button:GetAttribute("Keybind")
			if type(key)=="string" then pcall(function() item.Key=Enum.KeyCode[key] end) end

				if child:IsA("TextLabel") then
					item.Words[normalize(child.Text)]=true
					if normalize(child.Name)=="skillname" or normalize(child.Name)=="abilityname" then item.Name=child.Text end
				end
			end
			if type(item.Name)=="string" then item.Words[normalize(item.Name)]=true else item.Name=nil end
			table.insert(Controls.List,item)
		end
	end
end
local function findControl(names)
	local found
	for _,item in ipairs(Controls.List) do
		local match=false
		for _,name in ipairs(names) do if item.Words[normalize(name)] then match=true; break end end
		if match and visible(item.Button) then if found and found.Button~=item.Button then return nil,"Ambiguous game control" end; found=item end
	end
	return found
end
local function fireControl(item)
	local button=item and item.Button
	if not button or not visible(button) then return false,"Game control not found" end
	if button:GetAttribute("OnCooldown")==true or button:GetAttribute("Ready")==false or (tonumber(button:GetAttribute("CooldownRemaining")) or 0)&gt;0 then return false,"Cooldown" end
	if type(firesignal)=="function" then
		local event=button.Activated
		if type(getconnections)=="function" then
			local ok,a=pcall(getconnections,event); local ok2,c=pcall(getconnections,button.MouseButton1Click)
			if ok and ok2 then
				if #a==0 and #c&gt;0 then event=button.MouseButton1Click
				elseif #a==0 and #c==0 then
					if item.Key then return keyPulse(item.Key) end
					return false,"Game control has no readable input handler"
				end
			end
		end
		local ok=pcall(firesignal,event)
		if ok then return true end
	end
	if item.Key then return keyPulse(item.Key) end
	return false,"Executor cannot activate this control"
end
local function attack()
	local item=findControl({"Attack","AttackButton","Punch","PunchButton","M1","M1Button","BasicAttack"})
	if item then return fireControl(item) end
	local tool=LocalPlayer.Character and LocalPlayer.Character:FindFirstChildOfClass("Tool")
	if tool then local ok=pcall(function() tool:Activate() end); return ok,ok and nil or "Tool activation failed" end
	if not Input.TouchEnabled and vim then
		local point=Input:GetMouseLocation()
		local ok=pcall(function() vim:SendMouseButtonEvent(point.X,point.Y,0,true,game,0) end)
		if ok then local press={X=point.X,Y=point.Y}; held[press]=true; task.delay(0.05,function() release(press) end); return true end
	end
	return false,"Attack control unavailable · open the native combat HUD"
end
local function refreshSkills()

		Controls.Skills[1]={Name="Repulsor Blast",Control=findControl({"Repulsor Blast"})}
		Controls.Skills[3]={Name="Unibeam",Control=findControl({"Unibeam"})}
		-- Slot fallback is accepted only when exactly one control exposes that slot.
		local bySlot={}
		for _,item in ipairs(Controls.List) do
			if item.Slot then if bySlot[item.Slot]~=nil then bySlot[item.Slot]=false else bySlot[item.Slot]=item end end
		end
		for slot,skill in pairs(Controls.Skills) do if not skill.Control and bySlot[slot] then skill.Control=bySlot[slot] end end
	else
		for _,item in ipairs(Controls.List) do
			if item.Slot and item.Slot&gt;=1 and item.Slot&lt;=4 and item.Name and item.Name~="" then
				if Controls.Skills[item.Slot] then Controls.Skills[item.Slot]={Name="Unavailable"}
				else Controls.Skills[item.Slot]={Name=item.Name,Control=item} end
			end
		end
	end
	if API.OnSkills then API.OnSkills() end
end

function API.NearestTarget()
	local _,_,root=body(LocalPlayer); if not root then return end
	local best,bestDistance
	for _,plr in ipairs(Players:GetPlayers()) do
		if plr~=LocalPlayer then local _,_,otherRoot=body(plr); if otherRoot then
			local distance=(otherRoot.Position-root.Position).Magnitude
			if distance&lt;=math.max(Config.ChaseRange,Config.AuraRange) and (not bestDistance or distance&lt;bestDistance or distance==bestDistance and plr.UserId&lt;best.UserId) then best=plr; bestDistance=distance end
		end end
	end
	API.Target=best; return best,bestDistance
end
local function step(dt)
	dt=math.clamp(tonumber(dt) or 0,0,0.1)
	Controls.Age+=dt
	if Controls.Age&gt;=0.7 then scanControls(); refreshSkills(); for _,plr in ipairs(Players:GetPlayers()) do refreshHero(plr) end end
	if not active() then pauseActions(); return end
	local _,hum,root=body(LocalPlayer)
	if root.Anchored then pauseActions(); return end
	local target,distance=API.NearestTarget()
	local _,_,targetRoot=body(target)
	if not targetRoot then stopWalking(); burstLeft=0; burstTarget=nil; attackClock=0; skillClock=0 end
	if targetRoot and Config.Face then
		local look=Vector3.new(targetRoot.Position.X,root.Position.Y,targetRoot.Position.Z)
		if (look-root.Position).Magnitude&gt;0.1 then root.CFrame=CFrame.lookAt(root.Position,look) end
	end
	if Config.Chase and targetRoot and distance&lt;=Config.ChaseRange and distance&gt;Config.AuraRange*0.75 then hum:MoveTo(targetRoot.Position); walker=hum else stopWalking() end
	if Config.AutoDash then
		dashClock+=dt
		if dashClock&gt;=Config.DashInterval then dashClock=0; API.DashNow() end
	else dashClock=0 end
	if not targetRoot then burstLeft=0; burstTarget=nil; attackClock=0; skillClock=0; return end
	if Config.Aura and distance&lt;=Config.AuraRange then
		attackClock+=dt; burstClock+=dt
		if burstTarget~=target then burstLeft=0; burstTarget=target end
		if burstLeft==0 and attackClock&gt;=0.4 then attackClock=0; burstLeft=Config.Burst and 3 or 1; burstClock=0.08 end
		if burstLeft&gt;0 and burstClock&gt;=0.08 then
			burstClock=0; burstLeft-=1
			local ok,err=attack(); if not ok and err~="Cooldown" then Config.Aura=false; burstLeft=0; status(err); if API.OnAura then API.OnAura() end end
		end
	else burstLeft=0; attackClock=0 end
	if Config.AutoSkills and distance&lt;=Config.ChaseRange then
		skillClock+=dt
		if skillClock&gt;=Config.SkillInterval then
			skillClock=0
			for _=1,4 do
				skillIndex=skillIndex%4+1
				local skill=Controls.Skills[skillIndex]
				if Config.SkillSlots[skillIndex] and skill and skill.Control then
					local ok,err=fireControl(skill.Control); if not ok and err~="Cooldown" then status("Skill: "..tostring(err)) end
					break
				end
			end
		end
	else skillClock=0 end
end

function API.Unload()
	if not alive then return end

	for i=#owned,1,-1 do owned[i]:Destroy() end; table.clear(owned)
	if env.SuperheroArenaHub==API then env.SuperheroArenaHub=nil end
end

	text(f, title, 12, C.ink, UDim2.fromOffset(8, 8), UDim2.new(1, -105, 0, 18))

	local control = {}
	function control.Set(value, silent)
		value = math.clamp(value, minimum, maximum)
		local alpha = (value-minimum)/(maximum-minimum)
		fill.Size = UDim2.fromScale(alpha, 1); knob.Position = UDim2.fromScale(alpha, 0.5)
		label.Text = format(value)
		if not silent then changed(value) end
	end
	control.Set(initial, true)
	local function move(x)
		if hit.AbsoluteSize.X &lt;= 0 then return end
		control.Set(minimum+(maximum-minimum)*math.clamp((x-hit.AbsolutePosition.X)/hit.AbsoluteSize.X, 0, 1))
	end
	connect(hit.InputBegan, function(input)
		if input.UserInputType == Enum.UserInputType.MouseButton1 or input.UserInputType == Enum.UserInputType.Touch then
			activeSlider = { input = input, move = move }; move(input.Position.X)
		end
	end)
	return control
end

local function draggable(handle,target)
	connect(handle.InputBegan,function(input)
		if input.UserInputType==Enum.UserInputType.Touch or input.UserInputType==Enum.UserInputType.MouseButton1 then
			drag={input=input,target=target,start=input.Position,origin=target.Position}; API.SuppressBubble=false
		end
	end)
end
draggable(header,root); draggable(bubble,bubble)
connect(Input.InputChanged,function(input)
	if activeSlider and (input==activeSlider.input or input.UserInputType==Enum.UserInputType.MouseMovement and activeSlider.input.UserInputType==Enum.UserInputType.MouseButton1) then activeSlider.move(input.Position.X) end
	if drag and (input==drag.input or input.UserInputType==Enum.UserInputType.MouseMovement and drag.input.UserInputType==Enum.UserInputType.MouseButton1) then
		local d=input.Position-drag.start; if d.Magnitude&gt;5 then API.SuppressBubble=true end
		local camera=workspace.CurrentCamera
		if camera then
			local view=camera.ViewportSize; local size=drag.target.AbsoluteSize
			local halfX=math.min(size.X/2+4,view.X/2); local halfY=math.min(size.Y/2+4,view.Y/2)
			local x=drag.origin.X.Scale*view.X+drag.origin.X.Offset+d.X
			local y=drag.origin.Y.Scale*view.Y+drag.origin.Y.Offset+d.Y
			drag.target.Position=UDim2.fromOffset(math.clamp(x,halfX,view.X-halfX),math.clamp(y,halfY,view.Y-halfY))
		end
	end
end)
connect(Input.InputEnded,function(input)
	if activeSlider and input==activeSlider.input then activeSlider=nil end
	if drag and input==drag.input then drag=nil; task.delay(0.15,function() if alive then API.SuppressBubble=false end end) end
end)

<script>
const source = document.getElementById('source');
const status = document.getElementById('status');
const copy = document.getElementById('copy');
const download = document.getElementById('download');
let downloadUrl = null;
let edited = false;
function fitEditor() {
  source.style.height = 'auto';
  source.style.height = (source.scrollHeight + 2) + 'px';
}
function selectAll() {
  source.focus();
  source.select();
  source.setSelectionRange(0, source.value.length);
  status.textContent = 'All current code selected. Choose Copy from your device’s selection menu.';
}
document.getElementById('select').addEventListener('click', selectAll);
source.addEventListener('input', () => {
  edited = true;
  fitEditor();
  status.textContent = 'Edited. Copy or download to keep your changes; this page does not save automatically.';
});
source.addEventListener('keydown', event => {
  if (event.key === 'Tab' && !event.shiftKey && !event.ctrlKey && !event.metaKey && !event.altKey) {
    event.preventDefault();
    source.setRangeText('	', source.selectionStart, source.selectionEnd, 'end');
    source.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
function fallbackCopy(code) {
  const area = document.createElement('textarea');
  area.value = code;
  area.readOnly = true;
  area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
  document.body.appendChild(area);
  area.focus();
  area.select();
  area.setSelectionRange(0, area.value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (error) {}
  area.remove();
  return ok;
}
copy.addEventListener('click', async () => {
  const code = source.value;
  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(code); ok = true; } catch (error) {}
  }
  if (!ok) ok = fallbackCopy(code);
  if (ok) {
    copy.textContent = 'Copied!';
    status.textContent = 'Current Lua code copied, including your edits. Paste it into Delta.';
    setTimeout(() => { copy.textContent = 'Copy all code'; }, 2000);
  } else {
    selectAll();
    status.textContent = 'Clipboard access was blocked. Your current code is selected; choose Copy from the selection menu.';
  }
});
function updateDownload() {
  if (downloadUrl) URL.revokeObjectURL(downloadUrl);
  downloadUrl = URL.createObjectURL(new Blob([source.value], { type: 'text/plain;charset=utf-8' }));
  download.href = downloadUrl;
}
download.addEventListener('click', () => {
  updateDownload();
  status.textContent = 'Downloading the current Lua code, including your edits.';
});
window.addEventListener('resize', fitEditor);
window.addEventListener('beforeunload', event => {
  if (edited) { event.preventDefault(); event.returnValue = ''; }
});
updateDownload();
fitEditor();
</script>
